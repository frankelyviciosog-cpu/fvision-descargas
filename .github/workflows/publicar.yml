name: Publicar instalador

# Los instaladores de Fvision llegan en trozos de menos de 100 MB (el tope de GitHub por archivo), con su
# versión y su huella, en la carpeta subida/. Se suben de a un trozo a la rama "carga" (que no dispara nada)
# y, cuando están todos, esa misma rama se empuja como "subida": ahí se arman, se comprueba que el archivo
# llegó entero y se publica en Releases. Al terminar se borran las dos ramas: en el repositorio solo quedan
# las publicaciones.
on:
  push:
    branches: [subida]
  # A mano: solo borra las ramas de subida, si quedó alguna.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Armar, comprobar y publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd subida
          version=$(tr -d '[:space:]' < VERSION)
          case "$version" in ''|*[!0-9.]*) echo "Versión inválida"; exit 1;; esac
          exe="FvisionSetup-$version.exe"
          cat "$exe".parte-* > "$exe"
          sha256sum -c SHA256
          tag="v$version"
          notas="Instalador de Fvision $version para Windows 10 y 11. Descarga $exe, ábrelo y sigue los pasos. Si Windows dice \"Windows protegió tu PC\", toca Más información y después Ejecutar de todas formas (el programa no tiene firma digital)."
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$exe" --clobber
          else
            gh release create "$tag" "$exe" --target main --title "Fvision $version" --notes "$notas"
          fi
      - name: Borrar las ramas de subida
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin --delete subida
          git push origin --delete carga || echo "La rama carga ya no estaba"

  limpiar:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Borrar las ramas de subida que hayan quedado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q vacio && cd vacio
          for rama in subida carga; do
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --delete "$rama" || echo "La rama $rama ya no estaba"
          done
